name: Fork branch build

# Builds a full, SIGNED RELEASE APK for personal fork branches and publishes it
# as a rolling per-branch prerelease. Uses the same prebuilt playback extensions
# (MPV/FFmpeg/AV1) as the official app, pulled from the public GitHub Packages
# repo and authenticated with your own read:packages token.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SIGNING_KEY, KEY_ALIAS, KEY_PASSWORD, KEY_STORE_PASSWORD  -> stable signing key
#   EXTENSIONS_USERNAME, EXTENSIONS_PASSWORD                  -> GitHub username + read:packages PAT

on:
  push:
    branches:
      - claude/**
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BRANCH_NAME: ${{ github.ref_name }}
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx8g -XX:MaxMetaspaceSize=512m'"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Need the tags to build
      - name: Fetch upstream tags
        run: git fetch https://github.com/damontecres/Wholphin.git --tags

      - name: Verify required secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          EXTENSIONS_USERNAME: ${{ secrets.EXTENSIONS_USERNAME }}
          EXTENSIONS_PASSWORD: ${{ secrets.EXTENSIONS_PASSWORD }}
        run: |
          missing=
          for s in SIGNING_KEY KEY_ALIAS KEY_PASSWORD KEY_STORE_PASSWORD EXTENSIONS_USERNAME EXTENSIONS_PASSWORD; do
            [ -z "${!s}" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required repo secrets:$missing — add them under Settings -> Secrets and variables -> Actions, then re-run this workflow."
            exit 1
          fi
          echo "All required secrets present."

      - name: Setup
        uses: ./.github/actions/setup

      - name: Get version names
        run: |
          LATEST_TAG=$(git describe --tags --match 'v*' --abbrev=0)
          VERSION_NAME=$(git describe --tags --match 'v*' --long)
          TAG_NAME="${BRANCH_NAME//\//-}"
          echo "LATEST_TAG=$LATEST_TAG" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Build signed release app (with extensions)
        env:
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
          KEY_STORE_PASSWORD: "${{ secrets.KEY_STORE_PASSWORD }}"
          SIGNING_KEY: "${{ secrets.SIGNING_KEY }}"
          ORG_GRADLE_PROJECT_WholphinExtensionsUsername: "${{ secrets.EXTENSIONS_USERNAME }}"
          ORG_GRADLE_PROJECT_WholphinExtensionsPassword: "${{ secrets.EXTENSIONS_PASSWORD }}"
        run: |
          ./gradlew assembleDefaultRelease -PforkBuild --no-daemon

      - name: Verify APK signatures
        run: |
          echo "Verifying APK signatures"
          find app/build/outputs/apk -name '*.apk' -print0 |
            xargs -t -0 -n1 "${{ env.ANDROID_SDK_ROOT }}/build-tools/${{ env.BUILD_TOOLS_VERSION }}/apksigner" verify --verbose --print-certs

      - name: Checksums
        run: |
          echo "SHA256 checksums:"
          find app/build/outputs/apk -name '*.apk' -print0 | xargs -0 sha256sum

      - name: Publish ${{ env.TAG_NAME }} prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar

          gh release delete "${{ env.TAG_NAME }}" --cleanup-tag -y || true

          echo '### `${{ env.BRANCH_NAME }}` fork build (signed release, full extensions)

          Full release build with the same playback extensions (MPV / FFmpeg / AV1) as the official app. Installs side-by-side with the official Wholphin release as a separate `.fork` package.

          To let the installed app update itself from this branch, set Settings->Advanced->Update URL to https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ env.TAG_NAME }}' > ci_release_note.txt

          gh release create "${{ env.TAG_NAME }}" \
            --latest=false --prerelease --title "${{ env.VERSION_NAME }} (${{ env.BRANCH_NAME }})" --target "${{ env.BRANCH_NAME }}" -F ci_release_note.txt \
            app/build/outputs/apk/**/*.apk
